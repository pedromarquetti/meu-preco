name: Publish Docker image

# Release images are published only from semver tags (or a manual dispatch that
# names an existing semver tag). Ordinary branch pushes and pull requests never
# reach this workflow.
#
# Required repository configuration before the first release:
#   - variable DOCKERHUB_USERNAME (Docker Hub account or organization)
#   - secret   DOCKERHUB_TOKEN    (scoped read/write Docker Hub access token)
#   - optional variable MEUPRECO_IMAGE; defaults to phlm/meu-preco
#
# Docker Hub OIDC federation can replace the token secret when the account plan
# supports it; see the plan's Phase 5 notes. This workflow uses a narrowly
# scoped token so it works with personal Docker Hub accounts.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ vars.MEUPRECO_IMAGE || 'phlm/meu-preco' }}

jobs:
  publish:
    name: Publish release image
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Determine release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$tag' is not a semver tag such as v1.2.3"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=sha-${{ steps.release.outputs.sha }}
            type=raw,value=latest,enable=${{ !contains(steps.release.outputs.tag, '-') }}
          labels: |
            org.opencontainers.image.title=MeuPreço
            org.opencontainers.image.description=Crowdsourced Brazilian supermarket price tracking API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.licenses=NOASSERTION

      - name: Build and push release image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
