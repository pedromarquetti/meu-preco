name: Docker

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: meupreco
  IMAGE_TAG: ci
  API_PORT: "127.0.0.1:18080:8080"

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: meupreco_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d meupreco_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USERNAME: ci
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: postgres
      POSTGRES_DB: meupreco_ci
      DATABASE_NAME: meupreco_ci
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      APP_UID: "10001"
      APP_GID: "10001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate image contents
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${IMAGE_TAG}"

          user="$(docker image inspect --format '{{.Config.User}}' "$image")"
          case "$user" in
            ""|root|0|0:*)
              echo "Image is running as root (user='$user'); it must run as an unprivileged user." >&2
              exit 1
              ;;
          esac

          if docker run --rm --entrypoint sh "$image" -c 'command -v go >/dev/null 2>&1'; then
            echo "Image contains a Go toolchain; the runtime image must be minimal." >&2
            exit 1
          fi

      - name: Test the built image
        env:
          POSTGRES_HOST: 127.0.0.1
          PORT: "18080"
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${IMAGE_TAG}"
          container=meupreco-smoke

          docker_args=(
            --network host
            -e POSTGRES_HOST
            -e POSTGRES_PORT=5432
            -e POSTGRES_USERNAME
            -e POSTGRES_PASSWORD
            -e DATABASE_NAME
            -e JWT_SECRET
            -e ADMIN_EMAIL
            -e ADMIN_PASSWORD
            -e PORT
          )

          docker run --rm "${docker_args[@]}" "$image" migrate up

          cleanup() {
            docker stop -t 15 "$container" >/dev/null 2>&1 || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" "${docker_args[@]}" "$image"

          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/healthz" 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API did not become healthy in time" >&2
              docker logs "$container" >&2
              exit 1
            fi
            sleep 1
          done

          curl -fsS "http://127.0.0.1:${PORT}/readyz"

          docker stop -t 15 "$container"
          docker rm "$container"
          trap - EXIT

      - name: Prepare compose test environment
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/meupreco-ci.env"
          {
            printf 'POSTGRES_USERNAME=%s\n' "$POSTGRES_USERNAME"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_HOST=%s\n' "$POSTGRES_HOST"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            printf 'APP_UID=%s\n' "$APP_UID"
            printf 'APP_GID=%s\n' "$APP_GID"
            printf 'API_PORT=%s\n' "$API_PORT"
          } > "$env_file"
          chmod 0600 "$env_file"

      - name: Validate Compose configuration
        run: |
          set -euo pipefail
          docker compose \
            --env-file "$RUNNER_TEMP/meupreco-ci.env" \
            -f compose_example.yaml \
            config --quiet

      - name: Start the Compose stack
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/meupreco-ci.env"
          compose=(docker compose --env-file "$env_file" -f compose_example.yaml)

          cleanup() {
            "${compose[@]}" ps >&2 || true
            "${compose[@]}" logs --no-color >&2 || true
            "${compose[@]}" down -v --remove-orphans >&2 || true
          }
          trap cleanup EXIT

          "${compose[@]}" up --build -d --wait --wait-timeout 180

          curl -fsS "http://127.0.0.1:18080/healthz"
          curl -fsS "http://127.0.0.1:18080/readyz"

          "${compose[@]}" down -v --remove-orphans
          trap - EXIT
