<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>meupreco API Documentation</title>

  <link
    rel="stylesheet"
    type="text/css"
    href="./swagger-ui.css"
  />

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #swagger-ui {
      max-width: 1460px;
      margin: 0 auto;
    }

    .swagger-ui .topbar {
      display: none;
    }

    .swagger-ui .info {
      margin-bottom: 20px;
    }

    .swagger-ui .info .title {
      font-size: 24px;
      font-weight: bold;
    }

    .swagger-ui .info .description p {
      font-size: 16px;
      line-height: 1.5;
      margin: 1em 0;
    }

    .swagger-ui .info .description h4 {
      font-size: 14px;
      font-weight: bold;
      margin: 0.5em 0;
    }

    .swagger-ui .info .description p:last-child {
      margin-bottom: 0;
    }

    .swagger-ui .info .description a {
      color: #0066cc;
      text-decoration: none;
    }

    .swagger-ui .info .description a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <script src="./swagger-ui-bundle.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: "#swagger-ui",
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout",
        validatorUrl: null,
        deepLinking: true,
        showExtensions: true,
        showCommonExtensions: true,
        filter: true,
        persistAuthorization: false,
        requestInterceptor: function(request) {
          if (request.url && request.url.startsWith("/auth")) {
            const token = localStorage.getItem("bearer_token");
            if (token) {
              request.headers.Authorization = `Bearer ${token}`;
            }
          }
          return request;
        },
        onComplete: function() {
          console.log("Swagger UI initialized");
        }
      });
    };
  </script>
</body>
</html>
